<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桑尼之子 · 动态背景层</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent; 
        }

        /* 背景层：保证鼠标穿透，不影响看板操作 */
        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* 底图路径已按你的要求保持为 bg.png */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 四角星微光：增加旋转与形状裁剪 */
        .mote {
            position: absolute;
            width: 20px;
            height: 20px;
            clip-path: polygon(50% 0%, 55% 45%, 100% 50%, 55% 55%, 50% 100%, 45% 55%, 0% 50%, 45% 45%);
            background: radial-gradient(circle, rgba(255, 250, 200, 1) 0%, rgba(255, 250, 200, 0) 70%);
            filter: drop-shadow(0 0 8px rgba(255, 250, 150, 0.8));
            opacity: 0;
            animation: mote-anim linear infinite;
            will-change: transform, opacity;
        }

        @keyframes mote-anim {
            0% { opacity: 0; transform: translate(0, 0) scale(0.3) rotate(0deg); }
            15% { opacity: 0.9; transform: translate(20px, -25px) scale(1) rotate(90deg); }
            50% { opacity: 0.2; transform: translate(-40px, -60px) scale(0.8) rotate(180deg); }
            85% { opacity: 0.8; transform: translate(30px, -100px) scale(1.1) rotate(270deg); }
            100% { opacity: 0; transform: translate(-20px, -160px) scale(0.4) rotate(360deg); }
        }

        /* 点状流星本体 + 拖尾渐隐 */
        #meteor {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #fff;
            box-shadow: 10px 0 15px rgba(255,255,255,0.8), 
                        25px 0 25px rgba(255,255,255,0.4), 
                        45px 0 40px rgba(255,255,255,0.1);
            pointer-events: none;
            opacity: 0;
            transform: rotate(-30deg); 
            will-change: transform, opacity;
        }

        #meteor.active {
            animation: meteor-anim 1.5s ease-in-out forwards;
        }

        @keyframes meteor-anim {
            0% { 
                opacity: 0; 
                transform: translate(100vw, -10vh) rotate(-30deg); 
            }
            15% { opacity: 1; }
            85% { opacity: 0.8; }
            100% { 
                opacity: 0; 
                transform: translate(-50vw, 60vh) rotate(-30deg); 
            }
        }
    </style>
</head>
<body>

    <div id="bg-layer">
        <!-- 底图路径：bg.png -->
        <img src="./bg.png" class="bg-image" alt="底图">
        
        <!-- 太阳容器已彻底删除 -->

        <div id="motes-container"></div>
        <div id="meteor"></div>
    </div>

    <script>
        // 【配置区】微光与流星频率（保持上一轮翻倍后的设置）
        const CONFIG = {
            MOTE_INTERVAL: 1000,        // 每隔1秒生成一颗微光
            METEOR_INTERVAL_MIN: 4000, // 流星最短间隔 4 秒
            METEOR_INTERVAL_MAX: 8000  // 流星最长间隔 8 秒
        };

        const motesContainer = document.getElementById('motes-container');
        
        function createMote() {
            const mote = document.createElement('div');
            mote.className = 'mote';
            mote.style.left = Math.random() * window.innerWidth + 'px';
            mote.style.top = Math.random() * window.innerHeight + 'px';
            const duration = 8 + Math.random() * 10;
            mote.style.animationDuration = duration + 's';
            motesContainer.appendChild(mote);
            setTimeout(() => {
                if (mote.parentNode) {
                    mote.parentNode.removeChild(mote);
                }
            }, duration * 1000);
        }

        const meteor = document.getElementById('meteor');
        function triggerMeteor() {
            meteor.classList.remove('active');
            void meteor.offsetWidth;
            meteor.classList.add('active');
            setTimeout(() => {
                meteor.classList.remove('active');
                setTimeout(triggerMeteor, CONFIG.METEOR_INTERVAL_MIN + Math.random() * (CONFIG.METEOR_INTERVAL_MAX - CONFIG.METEOR_INTERVAL_MIN));
            }, 1500); 
        }

        function init() {
            // 初始微光数量仍为 30 个
            for (let i = 0; i < 30; i++) {
                setTimeout(createMote, i * 100); 
            }
            setInterval(createMote, CONFIG.MOTE_INTERVAL);
            setTimeout(() => {
                triggerMeteor();
            }, 3000);
        }

        init();
    </script>
</body>
</html>
